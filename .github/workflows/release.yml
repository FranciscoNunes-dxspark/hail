# Every push to main is a release: it tests, builds the executables for every platform and publishes
# them as the next version, creating the tag. The next version is the latest release with the patch
# number raised (v0.2.0 → v0.2.1), or package.json's version when that's higher, which is how to
# move to a new minor or major version. Nothing is committed back; the version is baked into the builds.
# Pushes that only change Markdown don't release. "Run workflow" on the Actions tab releases by hand.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

# Releases go one at a time, so two quick merges get two versions in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // "v0.0.0"')"
          version="$(node -e '
            const [latest, pkg] = process.argv.slice(1).map((v) => v.replace(/^v/, "").split(".").map(Number));
            const newer = pkg[0] - latest[0] || pkg[1] - latest[1] || pkg[2] - latest[2];
            console.log((newer > 0 ? pkg : [latest[0], latest[1], latest[2] + 1]).join("."));
          ' "$latest" "$(node -p "require('./package.json').version")")"
          echo "Latest release $latest; releasing v$version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [version, test]
    strategy:
      matrix:
        include:
          # Bun only embeds the Windows icon when it builds on Windows.
          - os: windows-latest
            targets: bun-windows-x64
          - os: ubuntu-latest
            targets: bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # scripts/build.js bakes package.json's version into the executables.
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: bun scripts/build.js ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      # Creates the tag on this commit too.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Hail $TAG" --generate-notes
